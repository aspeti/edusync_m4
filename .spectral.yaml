# Lint del contrato OpenAPI (openapi.json) — Demo 2 / release 8.2.0.
# Base: ruleset oficial de Spectral para OpenAPI. Ajustes mínimos y justificados.
extends: ["spectral:oas"]
rules:
  # springdoc genera operationId a partir del nombre del método; es único por controlador
  # y se valida con la regla estándar (operation-operationId-unique), no se relaja.
  operation-description: off # el summary + @ApiResponse cubren la documentación requerida.
  info-description: error
  info-contact: warn
  oas3-api-servers: error
  # swagger-core/springdoc emite "default": null o "" en campos de records anotados con @Schema
  # y en parámetros @ParameterObject, aunque el código no declara defaultValue. Spectral lo
  # marca como ejemplo inválido (falsos positivos del toolchain, no del contrato de negocio).
  # Pendiente: eliminar el origen y reactivar esta regla.
  oas3-valid-schema-example: off
