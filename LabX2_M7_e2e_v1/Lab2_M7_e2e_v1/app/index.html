<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>SoporteIA</title>
<style>
  body{font-family:system-ui,sans-serif;margin:0;background:#f4f6fa;color:#1b2430}
  header{background:#1f3864;color:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center}
  main{max-width:900px;margin:24px auto;display:grid;grid-template-columns:2fr 1fr;gap:16px}
  section,aside{background:#fff;border:1px solid #d9dee7;border-radius:10px;padding:16px}
  #mensajes{list-style:none;padding:0;margin:0 0 12px;min-height:200px}
  #mensajes li{padding:8px 12px;border-radius:8px;margin-bottom:8px;max-width:85%}
  li.usuario{background:#e8f0fe;margin-left:auto}
  li.asistente{background:#eef3ea}
  li.alerta{background:#fde8e8;border:1px solid #e0a0a0}
  form{display:flex;gap:8px}
  input[type=text]{flex:1;padding:10px;border:1px solid #b9c2d0;border-radius:8px}
  button{padding:10px 16px;border:0;border-radius:8px;background:#1f3864;color:#fff;cursor:pointer}
  button.secundario{background:#6b7a90}
  .chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;background:#e3e8f0;margin-right:6px}
  #traza li{font-family:ui-monospace,monospace;font-size:12px}
  dl{margin:0} dt{font-size:12px;color:#6b7a90;margin-top:8px} dd{margin:0}
</style>
</head>
<body>
<header>
  <h1 style="margin:0;font-size:18px">SoporteIA</h1>
  <span>Conversación: <strong id="thread" data-testid="thread-id">demo</strong>
    <button type="button" class="secundario" id="nueva" data-testid="nueva-conversacion">Nueva conversación</button></span>
</header>
<main>
  <section aria-labelledby="titulo-chat">
    <h2 id="titulo-chat" style="margin-top:0">Chat</h2>
    <ul id="mensajes" role="log" aria-label="Mensajes" data-testid="mensajes"></ul>
    <form id="formulario">
      <label for="pregunta" style="position:absolute;left:-9999px">Tu consulta</label>
      <input id="pregunta" name="pregunta" type="text" placeholder="Escribe tu consulta" autocomplete="off" required minlength="2">
      <button type="submit" id="enviar">Enviar</button>
    </form>
    <p id="estado" role="status" aria-live="polite" data-testid="estado"></p>
  </section>
  <aside aria-labelledby="titulo-detalle">
    <h2 id="titulo-detalle" style="margin-top:0">Detalle de la última respuesta</h2>
    <dl>
      <dt>Intención</dt><dd><span class="chip" data-testid="intencion">—</span></dd>
      <dt>Ticket</dt><dd><span class="chip" data-testid="ticket">—</span></dd>
      <dt>Fuentes</dt><dd data-testid="citas">—</dd>
      <dt>Camino recorrido</dt><dd><ol id="traza" data-testid="traza"></ol></dd>
    </dl>
  </aside>
</main>
<script>
  const mensajes = document.getElementById('mensajes');
  const form = document.getElementById('formulario');
  const entrada = document.getElementById('pregunta');
  const estado = document.getElementById('estado');
  const nueva = document.getElementById('nueva');
  const thread = document.getElementById('thread');

  function agregar(texto, clase, testid) {
    const li = document.createElement('li');
    li.className = clase; li.textContent = texto; li.dataset.testid = testid;
    mensajes.appendChild(li);
  }
  function pintarDetalle(r) {
    document.querySelector('[data-testid=intencion]').textContent = r.intencion;
    document.querySelector('[data-testid=ticket]').textContent = r.ticket || '—';
    document.querySelector('[data-testid=citas]').textContent = r.citas.length ? r.citas.join(', ') : '—';
    const ol = document.getElementById('traza'); ol.innerHTML = '';
    r.traza.forEach(p => { const li = document.createElement('li'); li.textContent = p.nodo + ' · ' + p.detalle; ol.appendChild(li); });
  }
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const pregunta = entrada.value.trim(); if (!pregunta) return;
    agregar(pregunta, 'usuario', 'mensaje-usuario'); entrada.value = '';
    estado.textContent = 'Pensando…';
    const resp = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pregunta, thread_id: thread.textContent }) });
    const r = await resp.json();
    agregar(r.respuesta, r.bloqueado ? 'alerta' : 'asistente', r.bloqueado ? 'mensaje-bloqueado' : 'mensaje-asistente');
    if (r.bloqueado) mensajes.lastElementChild.setAttribute('role', 'alert');
    pintarDetalle(r);
    estado.textContent = r.escalado ? 'Escalado a una persona' : 'Listo';
  });
  nueva.addEventListener('click', () => {
    thread.textContent = 'c-' + Math.random().toString(36).slice(2, 8);
    mensajes.innerHTML = ''; estado.textContent = '';
    pintarDetalle({ intencion: '—', ticket: null, citas: [], traza: [] });
    entrada.focus();
  });
</script>
</body>
</html>
