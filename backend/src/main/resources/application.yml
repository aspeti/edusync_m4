spring:
  application:
    name: edusync-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Publico en los perfiles vigentes (dev/test); pendiente de revision cuando exista un
# perfil de produccion real (ADR-0012 §3, ver tambien shared.web.OpenApiConfig).
springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

edusync:
  security:
    jwt:
      # Solo desarrollo local: JWT_SECRET real MUST venir de AWS Secrets Manager en despliegue
      # (AGENTS.md §7). Longitud >= 32 caracteres, requerida por HS256 (io.jsonwebtoken.security.Keys).
      secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-please-32chars-min}
      expiration-seconds: ${JWT_EXPIRATION_SECONDS:28800}
  seed:
    sysadmin:
      # Valores por defecto NO son un secreto real: solo aplican en un entorno local recien
      # creado (tabla usuario vacia). MUST sobreescribirse via env vars en cualquier entorno
      # compartido (AGENTS.md §7).
      email: ${SYSADMIN_EMAIL:sysadmin@edusync.local}
      password: ${SYSADMIN_PASSWORD:changeme_local_dev}
  plataforma:
    scheduler:
      # Diario a las 03:00 (hora del servidor). @Scheduled interno de Spring, sin ShedLock
      # (DD-UC-003 §2, alternativa A: suficiente para 1 instancia del monolito).
      vencimiento-cron: ${EDUSYNC_VENCIMIENTO_CRON:0 0 3 * * *}
  # Spike LLM. Solo POST /api/v1/ai/chat. MUST NOT enviar PII/RUDE/notas.
  # provider: ollama | open-webui. API keys SOLO por env (nunca en git).
  ai:
    enabled: ${EDUSYNC_AI_ENABLED:true}
    provider: ${EDUSYNC_AI_PROVIDER:ollama}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model: ${OLLAMA_MODEL:llama3.1:latest}
      timeout-seconds: ${OLLAMA_TIMEOUT_SECONDS:120}
    open-webui:
      base-url: ${OPEN_WEBUI_BASE_URL:http://localhost:3000}
      # Vacío por defecto. Definir OPEN_WEBUI_API_KEY en el entorno local (.env gitignored).
      api-key: ${OPEN_WEBUI_API_KEY:}
      model: ${OPEN_WEBUI_MODEL:llama3.1:latest}
      timeout-seconds: ${OPEN_WEBUI_TIMEOUT_SECONDS:120}
