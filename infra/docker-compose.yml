name: edusync-dev

services:
  postgres:
    image: postgres:15
    container_name: edusync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-edusync}
      POSTGRES_USER: ${DB_USER:-edusync}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-edusync_dev_local}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - edusync_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-edusync} -d ${DB_NAME:-edusync}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # LAB S08: API Spring Boot. Por defecto usa backend/Dockerfile (versión "después").
  # Para la versión "antes": API_DOCKERFILE=Dockerfile.antes docker compose -f infra/docker-compose.yml build api
  api:
    build:
      context: ../backend
      dockerfile: ${API_DOCKERFILE:-Dockerfile}
    container_name: edusync-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-edusync}
      DB_USER: ${DB_USER:-edusync}
      DB_PASSWORD: ${DB_PASSWORD:-edusync_dev_local}
      EDUSYNC_AI_ENABLED: "false"
    ports:
      - "${API_PORT:-8080}:8080"

volumes:
  edusync_postgres_data:
